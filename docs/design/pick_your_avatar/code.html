<script>
  (function () {
    const cards = document.querySelectorAll('.avatar-option');
    let selectedIndex = 0;

    function updateSelection(targetIndex) {
      cards.forEach((card, idx) => {
        const badge = card.querySelector('.selection-pill');
        const frame = card.querySelector('.avatar-frame');

        if (idx === targetIndex) {
          card.classList.remove('shadow-sm');
          card.classList.add('shadow-md');
          card.classList.add('scale-[1.02]');
          frame.classList.add('bg-primary/20');
          if (badge) {
            badge.classList.remove('hidden');
            badge.classList.add('flex');
          }
        } else {
          card.classList.remove('shadow-md');
          card.classList.remove('scale-[1.02]');
          card.classList.add('shadow-sm');
          frame.classList.remove('bg-primary/20');
          if (badge) {
            badge.classList.add('hidden');
            badge.classList.remove('flex');
          }
        }
      });
      selectedIndex = targetIndex;
    }

    cards.forEach((card) => {
      card.addEventListener('click', () => {
        const idx = parseInt(card.getAttribute('data-index'), 10);
        updateSelection(idx);
      });
    });

    const startBtn = document.getElementById('start-playing-btn');
    if (startBtn) {
      startBtn.addEventListener('click', () => {
        startBtn.classList.add('opacity-90');
        setTimeout(() => {
          startBtn.classList.remove('opacity-90');
        }, 150);
      });
    }
  })();
