<script>
  (function initMatchCountdown() {
    let timeLeft = 3;
    const totalTime = 3;
    const fullCircumference = 326.7;
    const ring = document.getElementById('countdown-ring');
    const valText = document.getElementById('countdown-val');

    if (!ring || !valText) return;

    const timer = setInterval(() => {
      timeLeft -= 1;
      if (timeLeft > 0) {
        valText.textContent = timeLeft;
        valText.classList.add('scale-125');
        setTimeout(() => valText.classList.remove('scale-125'), 200);

        const progress = (totalTime - timeLeft) / totalTime;
        ring.style.strokeDashoffset = (fullCircumference * progress).toString();
      } else {
        clearInterval(timer);
        valText.textContent = 'GO!';
        valText.classList.add('scale-110', 'text-primary');
        ring.style.strokeDashoffset = fullCircumference.toString();
      }
    }, 1000);
  })();
