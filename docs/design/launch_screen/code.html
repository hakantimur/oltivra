<script>
  // Gentle tactile entry micro-enhancement
  document.addEventListener('DOMContentLoaded', () => {
    const brandElement = document.querySelector('.min-h-\\[calc\\(100vh-64px\\)\\]');
    if (brandElement) {
      brandElement.style.opacity = '0';
      brandElement.style.transform = 'translateY(6px)';
      brandElement.style.transition = 'opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
      
      requestAnimationFrame(() => {
        brandElement.style.opacity = '1';
        brandElement.style.transform = 'translateY(0)';
      });
    }
