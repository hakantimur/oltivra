[project]
name = "oltivra-backend"
version = "0.1.0"
description = "Oltivra authoritative live trivia backend (FastAPI / Cloud Run)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "firebase-admin>=6.5",
  "google-cloud-tasks>=2.16",
  "httpx>=0.27",
  "cryptography>=43",
  "anyio>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "locust>=2.31"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires the Firebase emulator suite (docker compose up emulators)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
